services:
  backend:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    env_file: ../.env
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
      args:
        API_INTERNAL_URL: http://backend:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
